<title>ALDA Chennai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F2EE; --card:#FFF; --band:#1A2624; --band2:#121C1B;
  --ink:#181713; --muted:#6E6A62; --faint:#928C82;
  --line:#DEDAD1; --line2:#EBE8E1;
  --amber:#C9761E; --amber-lo:#F5E7D6; --deep:#2F5D57;
  --onband:#EFEAE0; --onband-mut:#A9A194;
  --disp:"Fraunces",Georgia,serif; --sans:"Karla",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --col:1220px; --pad:clamp(20px,4vw,44px); --nav:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131211;--card:#1B1A17;--line:#2C2A26;--line2:#232120;
  --ink:#EFEAE1;--muted:#A29A8F;--faint:#7C756B;--amber:#E19343;--amber-lo:#3A2A18;}}
:root[data-theme="dark"]{
  --bg:#131211;--card:#1B1A17;--line:#2C2A26;--line2:#232120;
  --ink:#EFEAE1;--muted:#A29A8F;--faint:#7C756B;--amber:#E19343;--amber-lo:#3A2A18;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:var(--col);margin:0 auto;padding:0 var(--pad)}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;line-height:1.12;text-wrap:balance;margin:0}
p{margin:0 0 1.05em}
.lede{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:64ch}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
.sec{padding:clamp(56px,8vw,100px) 0}
.sec+.sec{border-top:1px solid var(--line)}
.page{display:none}.page.on{display:block}
.page:not(.on){content-visibility:hidden}

header.nav{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navin{max-width:var(--col);margin:0 auto;padding:0 var(--pad);display:flex;align-items:center;gap:26px;height:var(--nav)}
.brand{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:.13em;text-decoration:none}
.brand span{color:var(--amber)}
.navlinks{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.navlinks a{font-size:14.5px;text-decoration:none;color:var(--muted);padding:5px 0;border-bottom:1.5px solid transparent}
.navlinks a:hover{color:var(--ink)}
.navlinks a.on{color:var(--ink);border-bottom-color:var(--amber)}
.enq{background:var(--amber);color:#fff!important;font-weight:600;font-size:14px;padding:11px 20px;text-decoration:none;white-space:nowrap}
.burger{display:none;background:0;border:1px solid var(--line);color:var(--ink);padding:8px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;margin-left:auto}

/* ---------- scroll story ---------- */
.story{position:relative}
.storypin{position:sticky;top:var(--nav);height:calc(100vh - var(--nav));min-height:520px;overflow:hidden;background:#0e1615}
#cv{width:100%;height:100%;display:block}
.load{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#B9B2A5;background:#0e1615;transition:opacity .5s ease}
.load.gone{opacity:0;pointer-events:none}
.load i{display:block;width:180px;height:2px;background:rgba(255,255,255,.16);margin-top:14px;overflow:hidden}
.load i b{display:block;height:100%;width:0;background:var(--amber);transition:width .2s linear}
.beats{position:absolute;inset:0;pointer-events:none}
.beat{
  position:absolute;left:0;right:0;bottom:0;padding:0 0 clamp(40px,7vw,86px);
  opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease;
}
.beat.on{opacity:1;transform:none}
.beat .inner{max-width:var(--col);margin:0 auto;padding:0 var(--pad);max-width:min(var(--col),100%)}
.beat h2{font-size:clamp(28px,5vw,58px);color:#F4EFE5;max-width:18ch}
.beat p{color:#CFC7B9;max-width:54ch;margin-top:14px;font-size:clamp(15px,1.6vw,17.5px)}
.beat .figs{display:flex;gap:clamp(20px,4vw,44px);flex-wrap:wrap;margin-top:22px}
.beat .figs div{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#A9A194}
.beat .figs b{display:block;font-family:var(--disp);font-size:clamp(24px,3.4vw,38px);color:var(--amber);letter-spacing:.02em;line-height:1;margin-bottom:5px}
.beat .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;pointer-events:auto}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,22,21,.55) 0%,rgba(14,22,21,.05) 32%,rgba(14,22,21,.55) 68%,rgba(14,22,21,.95) 100%)}
.rail{position:absolute;right:var(--pad);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;pointer-events:none}
.rail i{display:block;width:2px;height:26px;background:rgba(239,234,224,.22)}
.rail i.on{background:var(--amber)}
.cue{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:rgba(239,234,224,.55);text-transform:uppercase}

.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:14.5px;padding:13px 24px;border:1.5px solid transparent;cursor:pointer;font-family:var(--sans)}
.btn-p{background:var(--amber);color:#fff}
.btn-g{border-color:rgba(244,239,229,.42);color:#F4EFE5}
.btn-o{border-color:var(--amber);color:var(--amber)}

.band{background:var(--band);color:var(--onband);position:relative;overflow:hidden}
.band .wrap{position:relative;z-index:2}
.bandimg{position:absolute;inset:0}
.bandimg img{width:100%;height:100%;object-fit:cover}
.bandimg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,28,27,.95) 0%,rgba(18,28,27,.74) 46%,rgba(18,28,27,.34) 100%)}
.phero{padding:clamp(60px,9vw,110px) 0}
.phero h1{font-size:clamp(34px,6vw,60px);color:var(--onband)}
.phero .lede{color:var(--onband-mut);margin-top:16px}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(22px,3vw,40px)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);padding:clamp(22px,3vw,32px)}
.card h3{font-size:23px;margin-bottom:10px}
.card p:last-child{margin-bottom:0}
.pcard{background:var(--card);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.pcard img{aspect-ratio:4/3;object-fit:cover;width:100%}
.pcard .pb{padding:20px 22px;display:flex;flex-direction:column;gap:7px;flex:1}
.pcard h3{font-size:21px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}
.tag.live{border-color:var(--amber);color:var(--amber)}
.tag.done{border-color:var(--deep);color:var(--deep)}
.spec{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:10px}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:1px solid var(--line);background:var(--card)}
.tl div{padding:26px 24px;border-right:1px solid var(--line)}
.tl div:last-child{border-right:0}
.tl b{display:block;font-family:var(--disp);font-size:clamp(28px,3.6vw,40px);font-weight:700;color:var(--amber);line-height:1}
.tl span{display:block;margin-top:9px;font-size:14.5px;color:var(--muted)}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:11px}
.ticks li{padding-left:26px;position:relative;color:var(--muted)}
.ticks li:before{content:"";position:absolute;left:0;top:.62em;width:11px;height:1.5px;background:var(--amber)}
.vals{display:grid;border-top:1px solid var(--line)}
.vals div{padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:210px 1fr;gap:24px}
.vals h4{font-size:19px}.vals p{margin:0;color:var(--muted)}
.locs{display:flex;flex-wrap:wrap;gap:9px}
.locs span{font-family:var(--mono);font-size:12.5px;padding:7px 13px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.notice{border-left:3px solid var(--amber);background:var(--amber-lo);padding:16px 20px;font-size:14.5px}
.notice b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:5px;color:var(--amber)}
.form{display:grid;gap:16px;max-width:560px}
.form label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.form input,.form select,.form textarea{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--sans);font-size:15.5px}
.form textarea{min-height:110px;resize:vertical}
.cinfo{font-family:var(--mono);font-size:14px;line-height:2;color:var(--muted)}
.cinfo a{color:var(--amber);text-decoration:none}
footer{background:var(--band2);color:var(--onband-mut);padding:56px 0 34px}
footer h4{color:var(--onband);font-size:17px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:34px}
footer a{color:var(--onband-mut);text-decoration:none;display:block;padding:4px 0;font-size:14.5px}
footer a:hover{color:var(--amber)}
.fbot{margin-top:40px;padding-top:22px;border-top:1px solid rgba(239,234,224,.14);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:12.5px}
.disc{font-size:12.5px;line-height:1.7;color:#8C857A;margin-top:20px}
@media (max-width:900px){
  .navlinks{display:none;position:absolute;top:var(--nav);left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;gap:0;padding:10px var(--pad) 18px}
  .navlinks.open{display:flex}
  .navlinks a{padding:11px 0;border-bottom:1px solid var(--line2)}
  .burger{display:block}.enq{margin-left:12px}
  .vals div{grid-template-columns:1fr;gap:6px}
  .tl div{border-right:0;border-bottom:1px solid var(--line)}
  .rail{display:none}
}
@media (prefers-reduced-motion:reduce){.beat{transition:none}*{scroll-behavior:auto!important}}
</style>
